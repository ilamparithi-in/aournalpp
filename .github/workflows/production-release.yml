name: Production Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag override (e.g. v1.0.0)'
        required: false
        type: string

jobs:
  build-release:
    name: Build & Sign Production Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK (r27d)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Set up Gradle Build Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Debian Packages
        uses: actions/cache@v6
        with:
          path: scripts/build/deb_cache
          key: deb-cache-${{ runner.os }}-${{ hashFiles('scripts/build_bootstrap.py') }}
          restore-keys: |
            deb-cache-${{ runner.os }}-

      - name: Decode Production Release Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble Signed Release APKs (Arm64 & X86_64)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleArm64Release assembleX86_64Release --stacktrace

      - name: Stage Release Artifacts
        run: |
          mkdir -p release-dist
          cp app/build/outputs/apk/arm64/release/*.apk release-dist/ || true
          cp app/build/outputs/apk/x86_64/release/*.apk release-dist/ || true
          cd release-dist
          sha256sum *.apk > checksums.txt
          ls -la

      - name: Upload Arm64 Release APK (Direct File Artifact)
        uses: actions/upload-artifact@v7
        with:
          name: aournalpp-arm64-release.apk
          path: app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 30

      - name: Upload X86_64 Release APK (Direct File Artifact)
        uses: actions/upload-artifact@v7
        with:
          name: aournalpp-x86_64-release.apk
          path: app/build/outputs/apk/x86_64/release/*.apk
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 30

      - name: Upload ProGuard Mappings
        uses: actions/upload-artifact@v7
        with:
          name: proguard-mappings
          path: app/build/outputs/mapping/
          archive: false
          compression-level: 0
          retention-days: 90

      - name: Create Draft GitHub Release with Individual APK Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "Aournal++ ${{ inputs.tag_name || github.ref_name }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*.apk
            release-dist/checksums.txt

      - name: Cleanup Keystores
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
