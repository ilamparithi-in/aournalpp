name: Debug CI Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish build to releases/tag/debug'
        required: false
        type: boolean
        default: true

concurrency:
  group: debug-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [arm64, x86_64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compute Deterministic x11-core Cache Key
        id: x11-cache-key
        run: |
          SUBMODULE_SHA=$(git rev-parse HEAD:submodules/termux-x11)
          CORE_SHA=$(git rev-parse HEAD:x11-core)
          echo "key=x11-core-aar-${SUBMODULE_SHA}-${CORE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Restore Prebuilt x11-core AAR
        id: x11-cache
        uses: actions/cache/restore@v4
        with:
          path: libs/x11-core-release.aar
          key: ${{ steps.x11-cache-key.outputs.key }}
          restore-keys: |
            x11-core-aar-

      - name: Restore Bootstrap Assets
        id: bootstrap-cache
        uses: actions/cache/restore@v4
        with:
          path: app/build/generated/bootstrap-assets/${{ matrix.flavor }}
          key: bootstrap-assets-${{ matrix.flavor }}-${{ hashFiles('scripts/build_bootstrap.py', 'scripts/bootstrap.lock.json', 'scripts/*.c') }}

      - name: Set up Android NDK (r27d)
        if: steps.x11-cache.outputs.cache-hit != 'true' || steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Set up Gradle Build Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permissions for Gradle Wrapper
        run: chmod +x gradlew

      - name: Checkout Submodules (Fallback)
        if: steps.x11-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      - name: Build Prebuilt x11-core AAR (Fallback)
        if: steps.x11-cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew :x11-core:assembleRelease -PusePrebuiltX11=false --stacktrace
          mkdir -p libs
          cp x11-core/build/outputs/aar/x11-core-release.aar libs/x11-core-release.aar

      - name: Cache Prebuilt x11-core AAR (Fallback)
        # Always multi arch so we check only for arm64
        if: steps.x11-cache.outputs.cache-hit != 'true' && matrix.flavor == 'arm64' 
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: libs/x11-core-release.aar
          key: ${{ steps.x11-cache-key.outputs.key }}

      - name: Build ${{ matrix.flavor }} Debug APK
        run: |
          capitalizedFlavor=$(echo "${{ matrix.flavor }}" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          ./gradlew assemble${capitalizedFlavor}Debug --stacktrace

      - name: Upload ${{ matrix.flavor }} Debug APK (Direct File)
        uses: actions/upload-artifact@v7
        with:
          name: aournalpp-${{ matrix.flavor }}-debug.apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7

  publish-debug-release:
    name: Publish Latest Debug Release
    needs: build-debug
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release != false)
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Debug APKs
        uses: actions/download-artifact@v7
        with:
          path: release-dist
          merge-multiple: true

      - name: Stage Release Artifacts
        run: |
          cd release-dist
          ls -la
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Publish to GitHub Debug Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: debug
          target_commitish: ${{ github.sha }}
          name: "Aournal++ Latest Debug"
          draft: false
          prerelease: true
          make_latest: true
          generate_release_notes: true
          body: |
            The app will see its first beta and release builds once I pay the fee to unc google to get play publishing privileges. Until then, please enjoy this debug build!

            As CI debug builds expire after 7 days, this release will regularly be updated with the latest commits. Pleeeease feel free to report bugs in the issues tab!
          files: |
            release-dist/*.apk
            release-dist/checksums.txt

