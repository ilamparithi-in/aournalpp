name: Debug CI Build

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'feat/**'
    tags-ignore:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: debug-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Arm64 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK (r27d)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Set up Gradle Build Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Debian Packages
        uses: actions/cache@v6
        with:
          path: scripts/build/deb_cache
          key: deb-cache-${{ runner.os }}-${{ hashFiles('scripts/build_bootstrap.py') }}
          restore-keys: |
            deb-cache-${{ runner.os }}-

      - name: Grant Execute Permissions for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Arm64 Debug APK
        run: ./gradlew assembleArm64Debug --stacktrace

      - name: Upload Arm64 Debug APK (Direct File)
        uses: actions/upload-artifact@v7
        with:
          name: aournalpp-arm64-debug.apk
          path: app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
