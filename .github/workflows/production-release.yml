name: Production Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag override (e.g. v1.0.0)'
        required: false
        type: string

jobs:
  build-release:
    name: Build & Sign Production Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compute Deterministic x11-core Cache Key
        id: x11-cache-key
        run: |
          SUBMODULE_SHA=$(git rev-parse HEAD:submodules/termux-x11)
          CORE_SHA=$(git rev-parse HEAD:x11-core)
          echo "key=x11-core-aar-${SUBMODULE_SHA}-${CORE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Restore Prebuilt x11-core AAR
        id: x11-cache
        uses: actions/cache/restore@v4
        with:
          path: libs/x11-core-release.aar
          key: ${{ steps.x11-cache-key.outputs.key }}
          restore-keys: |
            x11-core-aar-

      - name: Restore Bootstrap Assets (Arm64)
        id: bootstrap-cache-arm64
        uses: actions/cache/restore@v4
        with:
          path: app/build/generated/bootstrap-assets/arm64
          key: bootstrap-assets-arm64-${{ hashFiles('scripts/build_bootstrap.py', 'scripts/bootstrap.lock.json', 'scripts/*.c') }}
          restore-keys: |
            bootstrap-assets-arm64-

      - name: Restore Bootstrap Assets (X86_64)
        id: bootstrap-cache-x86_64
        uses: actions/cache/restore@v4
        with:
          path: app/build/generated/bootstrap-assets/x86_64
          key: bootstrap-assets-x86_64-${{ hashFiles('scripts/build_bootstrap.py', 'scripts/bootstrap.lock.json', 'scripts/*.c') }}
          restore-keys: |
            bootstrap-assets-x86_64-

      - name: Set up Android NDK (r27d)
        if: steps.x11-cache.outputs.cache-hit != 'true' || steps.bootstrap-cache-arm64.outputs.cache-hit != 'true' || steps.bootstrap-cache-x86_64.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Set up Gradle Build Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Production Release Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble Signed Release APKs (Arm64 & X86_64)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleArm64Release assembleX86_64Release --stacktrace

      - name: Stage Release Artifacts
        run: |
          mkdir -p release-dist
          cp app/build/outputs/apk/arm64/release/*.apk release-dist/ || true
          cp app/build/outputs/apk/x86_64/release/*.apk release-dist/ || true
          cd release-dist
          sha256sum *.apk > checksums.txt
          ls -la

      - name: Upload Arm64 Release APK (Direct File Artifact)
        uses: actions/upload-artifact@v7
        with:
          name: aournalpp-arm64-release.apk
          path: app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 30

      - name: Upload X86_64 Release APK (Direct File Artifact)
        uses: actions/upload-artifact@v7
        with:
          name: aournalpp-x86_64-release.apk
          path: app/build/outputs/apk/x86_64/release/*.apk
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 30

      - name: Upload ProGuard Mappings
        uses: actions/upload-artifact@v7
        with:
          name: proguard-mappings
          path: app/build/outputs/mapping/
          compression-level: 0
          retention-days: 90

      - name: Create Draft GitHub Release with Individual APK Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "Aournal++ ${{ inputs.tag_name || github.ref_name }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*.apk
            release-dist/checksums.txt

      - name: Cleanup Keystores
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
