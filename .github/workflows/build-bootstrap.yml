name: Build & Cache Bootstrap Archive

on:
  push:
    branches:
      - '**'
    paths:
      - 'scripts/build_bootstrap.py'
      - 'scripts/bootstrap.lock.json'
      - 'scripts/*.c'
      - '.github/workflows/build-bootstrap.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build_bootstrap.py'
      - 'scripts/bootstrap.lock.json'
      - 'scripts/*.c'
      - '.github/workflows/build-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: build-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bootstrap:
    name: Build & Cache Bootstrap (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: arm64
            task: generateBootstrapArm64
          - flavor: x86_64
            task: generateBootstrapX86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android NDK (r27d)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Set up Gradle Build Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permissions for Gradle Wrapper
        run: chmod +x gradlew

      - name: Generate Bootstrap (${{ matrix.flavor }})
        run: ./gradlew :app:${{ matrix.task }} --stacktrace

      - name: Cache Bootstrap Assets
        uses: actions/cache/save@v4
        with:
          path: app/build/generated/bootstrap-assets/${{ matrix.flavor }}
          key: bootstrap-assets-${{ matrix.flavor }}-${{ hashFiles('scripts/build_bootstrap.py', 'scripts/bootstrap.lock.json', 'scripts/*.c') }}

      - name: Upload Bootstrap Assets Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-assets-${{ matrix.flavor }}
          path: app/build/generated/bootstrap-assets/${{ matrix.flavor }}
          retention-days: 30
