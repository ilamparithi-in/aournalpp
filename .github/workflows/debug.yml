name: Debug CI Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: debug-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [arm64, x86_64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Wait for In-Flight Builder Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_COMMIT="$GITHUB_SHA"
          echo "[*] Checking for active builder workflows on commit $TARGET_COMMIT..."

          # 1. Check for active x11-core build
          X11_RUN_ID=$(gh run list --workflow "build-x11-core.yml" --commit "$TARGET_COMMIT" \
            --json databaseId,status -q '.[] | select(.status != "completed") | .databaseId' | head -n 1)
          if [ -n "$X11_RUN_ID" ]; then
            echo "[*] Active x11-core build detected (Run ID: $X11_RUN_ID). Waiting for completion..."
            gh run watch "$X11_RUN_ID" --exit-status
          fi

          # 2. Check for active bootstrap build
          BOOTSTRAP_RUN_ID=$(gh run list --workflow "build-bootstrap.yml" --commit "$TARGET_COMMIT" \
            --json databaseId,status -q '.[] | select(.status != "completed") | .databaseId' | head -n 1)
          if [ -n "$BOOTSTRAP_RUN_ID" ]; then
            echo "[*] Active bootstrap build detected (Run ID: $BOOTSTRAP_RUN_ID). Waiting for completion..."
            gh run watch "$BOOTSTRAP_RUN_ID" --exit-status
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compute Deterministic x11-core Cache Key
        id: x11-cache-key
        run: |
          SUBMODULE_SHA=$(git rev-parse HEAD:submodules/termux-x11)
          CORE_SHA=$(git rev-parse HEAD:x11-core)
          echo "key=x11-core-aar-${SUBMODULE_SHA}-${CORE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Restore Prebuilt x11-core AAR
        id: x11-cache
        uses: actions/cache/restore@v4
        with:
          path: libs/x11-core-release.aar
          key: ${{ steps.x11-cache-key.outputs.key }}
          restore-keys: |
            x11-core-aar-

      - name: Restore Bootstrap Assets
        id: bootstrap-cache
        uses: actions/cache/restore@v4
        with:
          path: app/build/generated/bootstrap-assets/${{ matrix.flavor }}
          key: bootstrap-assets-${{ matrix.flavor }}-${{ hashFiles('scripts/build_bootstrap.py', 'scripts/bootstrap.lock.json', 'scripts/*.c') }}
          restore-keys: |
            bootstrap-assets-${{ matrix.flavor }}-

      - name: Set up Android NDK (r27d)
        if: steps.x11-cache.outputs.cache-hit != 'true' || steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Set up Gradle Build Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permissions for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build ${{ matrix.flavor }} Debug APK
        run: |
          capitalizedFlavor=$(echo "${{ matrix.flavor }}" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          ./gradlew assemble${capitalizedFlavor}Debug --stacktrace

      - name: Upload ${{ matrix.flavor }} Debug APK (Direct File)
        uses: actions/upload-artifact@v7
        with:
          name: aournalpp-${{ matrix.flavor }}-debug.apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
